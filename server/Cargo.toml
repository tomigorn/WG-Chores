[package]
name = "wg-chores"
version = "2.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled", "functions", "backup"] }
rpassword = "7"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
ring = "0.17"
url = "2"
serde_json = "1"
argon2 = "0.6.0"
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
hmac = "0.13"
tower-http = { version = "0.7", default-features = false, features = ["compression-gzip"] }
rsa = { version = "0.10", optional = true, features = ["pkcs1v15"] }
rand = { version = "0.10", optional = true }
tower-service = { version = "0.3", optional = true }

[features]
test-util = ["dep:rsa", "dep:rand", "dep:tower-service", "axum/query", "axum/form"]

[[bin]]
name = "fake-oidc"
required-features = ["test-util"]

[dev-dependencies]
wg-chores = { path = ".", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
p256 = { version = "0.14", features = ["ecdh"] }
tokio = { version = "1", features = ["test-util"] }

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
