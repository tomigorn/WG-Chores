# fastpi: public demo wg-chores-demo.holy-grail.ch, local accounts, data reset nightly (systemd/wg-chores-demo-reset.timer).
# docker compose -f compose.demo.yaml up -d   (needs secrets/demo_password, 12+ characters)
name: wg-chores-demo
services:
  wg-chores-demo:
    image: wg-chores-v2:local
    container_name: wg-chores-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      PUBLIC_URL: https://wg-chores-demo.holy-grail.ch
      TZ: Europe/Zurich
      LOCAL_ACCOUNTS: "true"
      OPEN_REGISTRATION: "false"
      DEMO_MODE: "true"
      DEMO_PASSWORD_FILE: /run/secrets/demo_password # leak-check: ok
    secrets:
      - demo_password
    volumes:
      - wg-chores-demo-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/wg-chores", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

secrets:
  demo_password:
    file: ./secrets/demo_password

volumes:
  wg-chores-demo-data:
