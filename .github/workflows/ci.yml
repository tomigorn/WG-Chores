name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      skip_android:
        description: Skip the Android job (the image release needs only server and web)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip_android:
        description: Skip the Android job (update.yml sets it when nothing under android/ changed)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - name: Format
        working-directory: server
        run: cargo fmt --check
      - name: Clippy
        working-directory: server
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: server
        run: cargo test --locked

  readme:
    name: README fits Docker Hub
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: At most 25,000 bytes file size, only absolute links
        run: |
          test "$(wc -c < README.md)" -le 25000
          if grep -nP '\]\((?!https?://|mailto:|#)' README.md; then exit 1; fi

  web:
    name: Web (test, check, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node major of the Dockerfile
        id: node
        run: echo "major=$(sed -n 's/^FROM node:\([0-9]*\)-.*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run check
      - working-directory: web
        run: npm run build

  e2e:
    name: Browser suite (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      E2E_OUT: ${{ github.workspace }}/web/e2e-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          key: e2e
      - name: Node major of the Dockerfile
        id: node
        run: echo "major=$(sed -n 's/^FROM node:\([0-9]*\)-.*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build server with embedded web app
        working-directory: web
        run: npm run e2e:build
      - name: Run browser suite
        working-directory: web
        run: npm run e2e
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-out
          path: web/e2e-out
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Android (JVM tests, screenshots, release build)
    if: ${{ !inputs.skip_android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK major of android/build-env/Dockerfile
        id: jdk
        run: echo "major=$(sed -n 's/^FROM eclipse-temurin:\([0-9]*\)-.*/\1/p' android/build-env/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.major }}
          cache: gradle
          cache-dependency-path: |
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/gradle.lockfile
      - name: Android SDK platform and build tools (same as android/build-env/Dockerfile)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: JVM tests, screenshot check, release build (a stale gradle.lockfile fails here)
        working-directory: android
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest verifyRoborazziDebug assembleRelease
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/roborazzi
          retention-days: 7
          if-no-files-found: ignore
