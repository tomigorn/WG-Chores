name: Update

# Daily hands-off dependency updates, no pull requests: candidates as signed commits on auto-update* branches, ci.yml on each, main fast-forwarded to what passed, then Release.
# Script and rules: scripts/update_deps.py, held-back list: scripts/update-deps.ignore, guide: docs/guides/docker-hub-release.md (step 7).
on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      android:
        description: Also Android libraries (always on Mondays)
        type: boolean
        default: false
      dry_run:
        description: Only find updates, commit and test nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  candidates:
    name: Find updates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Script unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - id: plan
        name: Android today?
        env:
          ANDROID_INPUT: ${{ inputs.android }}
        run: |
          { echo "REPORT=$RUNNER_TEMP/report.md"; echo "CAND=$RUNNER_TEMP/candidates"; } >> "$GITHUB_ENV"
          if [ "$(date -u +%u)" = 1 ] || [ "$ANDROID_INPUT" = true ]; then echo "android=true" >> "$GITHUB_OUTPUT"; else echo "android=false" >> "$GITHUB_OUTPUT"; fi
          echo "node=$(sed -n 's/^FROM node:\([0-9]*\)-.*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "jdk=$(sed -n 's/^FROM eclipse-temurin:\([0-9]*\)-.*/\1/p' android/build-env/Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.plan.outputs.node }}
      - if: steps.plan.outputs.android == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ steps.plan.outputs.jdk }}
      - if: steps.plan.outputs.android == 'true'
        name: Android SDK (same as ci.yml)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: GitHub Actions pins (report only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_deps.py actions --report "$REPORT"
      # No token from here on: Gradle runs third-party build code; npm runs with --ignore-scripts.
      - name: Compatible updates
        env:
          ANDROID_FLAG: ${{ steps.plan.outputs.android == 'true' && '--android' || '' }}
        run: |
          mkdir -p "$CAND"
          # shellcheck disable=SC2086
          python3 scripts/update_deps.py compatible --report "$REPORT" $ANDROID_FLAG
          python3 scripts/update_deps.py changeset --title "WG-Chores: dependency updates" --out "$CAND/base.json"
          git -c user.name=update -c user.email=update@example.com -c commit.gpgsign=false commit -qam base --allow-empty --no-verify
      - name: Separate candidates (majors, LTS, Rust toolchain), each on top of the compatible updates
        run: |
          python3 scripts/update_deps.py separate > "$RUNNER_TEMP/separate.json"
          i=0
          while IFS=$'\t' read -r id title; do
            [ -n "$id" ] || continue
            i=$((i + 1))
            git reset -q --hard HEAD
            if python3 scripts/update_deps.py apply "$id" --report "$REPORT"; then
              python3 scripts/update_deps.py changeset --title "WG-Chores: $title" --out "$CAND/separate-$i.json"
            else
              echo "::warning::$id could not be applied, skipped"
              echo "- $id: could not be applied (see the job log)" >> "$REPORT"
            fi
          done < <(jq -r '.[] | [.id, .title] | @tsv' "$RUNNER_TEMP/separate.json")
          git reset -q --hard HEAD
      - name: Report
        if: always()
        run: if [ -f "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidates
          path: ${{ runner.temp }}/candidates
          retention-days: 7
          if-no-files-found: ignore

  ship:
    name: Test, land, release
    needs: candidates
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      # signed commits on auto-update* branches and the fast-forward of main
      contents: write
      # dispatches ci.yml (per candidate) and release.yml
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: candidates
          path: ${{ runner.temp }}/candidates
      - name: Commit, test, land, release
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidates"
          weekly=()
          if [ "$(date -u +%u)" = 1 ]; then weekly=(--weekly-rebuild); fi
          python3 scripts/update_deps.py ship --candidates "$RUNNER_TEMP/candidates" --main-sha "$MAIN_SHA" --release "${weekly[@]}"
