name: Dependabot auto-merge

# pull_request, not pull_request_target: runs only on Dependabot's own same-repo PRs, checks out nothing, uses no secrets.
on:
  pull_request:

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge minor, patch and digest updates
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.repository == 'tomigorn/WG-Chores'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      # dispatches release.yml: a merge made with GITHUB_TOKEN starts no push workflows
      actions: write
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - id: decide
        name: Decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          merge=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch | version-update:semver-minor) merge=true ;;
            "") if [ "$ECOSYSTEM" = docker ]; then merge=true; fi ;;
          esac
          case ",${NAMES// /}," in
            *,@playwright/test,*) merge=false ;;
          esac
          echo "update-type '$UPDATE_TYPE', ecosystem '$ECOSYSTEM', dependencies '$NAMES': merge=$merge"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"

      - name: Label major
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: gh pr edit "$PR_URL" --add-label major || echo "::warning::label 'major' missing in the repository"

      - name: Enable auto-merge (squash)
        if: steps.decide.outputs.merge == 'true'
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Wait for the merge, then start the release
        if: steps.decide.outputs.merge == 'true'
        run: |
          for _ in $(seq 1 80); do
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            case "$state" in
              MERGED)
                gh workflow run release.yml --ref main
                echo "merged, release.yml started"
                exit 0
                ;;
              CLOSED)
                echo "closed without merge"
                exit 0
                ;;
            esac
            sleep 60
          done
          echo "::warning::not merged within 80 minutes (CI red or slow); the Monday release run picks it up once merged"
