# Auto-merge rules (minor, patch, digest; never majors or @playwright/test): .github/workflows/dependabot-auto-merge.yml
version: 2

updates:
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      rust-crates:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      npm-packages:
        update-types: [minor, patch]
        # fastpi's preinstalled Chromium must match: own PR, merged by hand
        exclude-patterns: ["@playwright/test"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      android-libraries:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /android/build-env]
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    groups:
      docker-bases:
        update-types: [minor, patch]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [minor, patch]
